<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Widget Studio</title><style>body{font:17px system-ui;background:#10111b;color:white;max-width:650px;margin:auto;padding:24px}textarea,input,select,button{box-sizing:border-box;width:100%;padding:13px;margin:7px 0;border-radius:13px;border:1px solid #555;background:#222435;color:white;font:inherit}button{background:#7054bb;border:0;font-weight:bold}#preview{padding:25px;border-radius:25px;background:linear-gradient(135deg,#34304e,#141522);text-align:center;margin:18px 0;overflow-wrap:anywhere}#big{font-size:42px;font-weight:300}label{display:block;margin-top:12px}small{color:#bcbccc}</style><h1>Widget Studio</h1><p>Describe your widget.</p><textarea id="prompt" rows="3">Make a transparent purple digital clock</textarea><button id="generate">Generate design</button><label>Widget type<select id="kind"><option>clock</option><option>calendar</option><option>countdown</option><option>text</option><option>music</option><option>tesla</option></select></label><label>Accent<input id="accent" type="color" value="#c4a5ff"></label><label>Background<select id="bg"><option value="glass">Glass-inspired gradient</option><option value="clear">Clear-style (system dependent)</option><option value="solid">Solid dark</option></select></label><label>Title or custom text<input id="label" value="LOCAL TIME"></label><label>Countdown date<input id="date" type="date"></label><label>Music service<select id="service"><option value="music://">Apple Music</option><option value="spotify://">Spotify</option></select></label><div id="preview"><small id="heading"></small><div id="big"></div><small id="sub"></small></div><button id="copy">Copy Scriptable code</button><button id="save">Save design</button><small id="status" aria-live="polite"></small><textarea id="output" rows="12" readonly aria-label="Generated JavaScript"></textarea><p><small>Music and Tesla are launch shortcuts, not live data. Glass is a visual approximation. Native widget refresh and transparency are controlled by iOS.</small></p><script>
const $=id=>document.getElementById(id); const fields=['kind','accent','bg','label','date','service'];
function config(){return Object.fromEntries(fields.map(k=>[k,$(k).value]))}
function render(){const c=config(),n=new Date();$('heading').textContent=c.label;$('big').textContent=c.kind==='clock'?n.toLocaleTimeString([], {hour:'numeric',minute:'2-digit'}):c.kind==='calendar'?n.getDate():c.kind==='countdown'?(c.date?Math.max(0,Math.ceil((new Date(c.date+'T00:00:00')-n)/86400000))+' days':'Choose date'):c.kind==='music'?'♫ Music':c.kind==='tesla'?'Tesla':c.label;$('sub').textContent=c.kind==='clock'||c.kind==='calendar'?n.toLocaleDateString([], {weekday:'long',month:'short',day:'numeric'}):['music','tesla'].includes(c.kind)?'Tap to open app':'';$('big').style.color=c.accent;$('preview').style.background=c.bg==='clear'?'transparent':c.bg==='solid'?'#171721':'linear-gradient(135deg,#34304e,#141522)';$('output').value=code(c)}
function code(c){return `// Widget Studio — paste into Scriptable\nconst c = ${JSON.stringify(c)};\nconst w = new ListWidget();\nw.setPadding(16,16,16,16);\nif(c.bg==='glass'){const g=new LinearGradient();g.colors=[new Color('#34304e'),new Color('#141522')];g.locations=[0,1];w.backgroundGradient=g;}else if(c.bg==='solid'){w.backgroundColor=new Color('#171721');}\nfunction text(s,size,color){const t=w.addText(String(s));t.font=Font.systemFont(size);t.textColor=new Color(color);t.centerAlignText();t.minimumScaleFactor=0.5;return t;}\nconst now=new Date();\nw.addSpacer();\ntext(c.label,12,c.accent);w.addSpacer(8);\nif(c.kind==='clock'){const t=w.addDate(now);t.applyTimeStyle();t.font=Font.lightSystemFont(38);t.textColor=new Color(c.accent);t.centerAlignText();}\nelse if(c.kind==='calendar'){text(now.getDate(),44,c.accent);text(now.toLocaleDateString('en-US',{weekday:'long',month:'short'}),14,c.accent);}\nelse if(c.kind==='countdown'){text(c.date?Math.max(0,Math.ceil((new Date(c.date+'T00:00:00')-now)/86400000))+' days':'Choose date',32,c.accent);}\nelse if(c.kind==='music'){text('♫ Music',30,c.accent);w.url=c.service;text('Tap to open',12,c.accent);}\nelse if(c.kind==='tesla'){text('Tesla',30,c.accent);w.url='tesla://';text('Tap to open',12,c.accent);}\nelse{text(c.label,30,c.accent);}\nw.addSpacer();\nw.refreshAfterDate=new Date(Date.now()+60000);\nif(config.runsInWidget){Script.setWidget(w);}else{await w.presentMedium();}\nScript.complete();`}
$('generate').onclick=()=>{const p=$('prompt').value.toLowerCase();$('kind').value=p.includes('tesla')?'tesla':/music|spotify/.test(p)?'music':/countdown/.test(p)?'countdown':/calendar|date/.test(p)?'calendar':/clock|time/.test(p)?'clock':'text';$('label').value=$('kind').value==='text'?$('prompt').value:$('kind').value.toUpperCase();$('bg').value=/transparent|clear/.test(p)?'clear':p.includes('solid')?'solid':'glass';for(const [name,color] of Object.entries({purple:'#c4a5ff',blue:'#80baff',green:'#80efad',red:'#ff8080',white:'#ffffff',pink:'#ff9bd8',gold:'#ffd780'})){if(p.includes(name))$('accent').value=color}if(p.includes('spotify'))$('service').value='spotify://';render()};fields.forEach(k=>$(k).addEventListener('input',render));$('copy').onclick=async()=>{try{await navigator.clipboard.writeText($('output').value);$('status').textContent='Copied!'}catch(e){$('output').focus();$('output').select();$('status').textContent='Select all and copy the code manually.'}};$('save').onclick=()=>{try{localStorage.setItem('widgetStudio',JSON.stringify(config()));$('status').textContent='Saved on this browser.'}catch(e){$('status').textContent='Browser storage unavailable.'}};try{const c=JSON.parse(localStorage.getItem('widgetStudio'));if(c)fields.forEach(k=>$(k).value=c[k])}catch(e){}render();setInterval(render,15000);
</script></html>
